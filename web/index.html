<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Desk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230A0E16'/%3E%3Cpath d='M2 11l3-3 3 2 6-6' stroke='%23D98A3D' stroke-width='2' fill='none'/%3E%3C/svg%3E" />
  <style>
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--ground); color: var(--ink-1);
      font-family: var(--font-ui); font-size: var(--fs-body);
      -webkit-font-smoothing: antialiased;
    }
    .shell { display: flex; flex-direction: column; height: 100vh; }
    .topbar {
      height: var(--topbar-h); flex: none; display: flex; align-items: center;
      gap: var(--space-3); padding: 0 var(--space-3);
      justify-content: space-between;
      background: var(--surface-2); border-bottom: 1px solid var(--line-2);
      font-family: var(--font-mono); font-size: var(--fs-body);
      font-variant-numeric: tabular-nums;
    }
    .body { display: flex; flex: 1; min-height: 0; }
    .chartcell { flex: 1; min-width: 0; position: relative; background: var(--ground); }
    .panel {
      width: 288px; flex: none; background: var(--surface-1);
      border-left: 1px solid var(--line-2); overflow-y: auto;
    }
    .ptitle {
      font-family: var(--font-ui); font-size: var(--fs-micro);
      letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim);
      padding: var(--space-4) var(--space-3) var(--space-2);
    }
    .mrow {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, auto);
      gap: var(--space-3); align-items: baseline;
      padding: var(--space-2) var(--space-3);
      font-family: var(--font-mono); font-size: var(--fs-caption);
      line-height: var(--lh-ui);
      border-bottom: 1px solid var(--line-1);
    }
    /* The label truncates; the value never does. A clipped name is still
       recognisable, a clipped number is a different number. */
    .mk {
      font-family: var(--font-ui); color: var(--ink-3); min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .mv {
      color: var(--ink-1); font-variant-numeric: tabular-nums; text-align: right;
      min-width: 0; overflow-wrap: anywhere;
    }
        .mrow.is-wide { grid-template-columns: minmax(0, 1fr); gap: var(--space-1); }
    .mrow.is-wide .mk { white-space: normal; }
    .mrow.is-wide .mv { text-align: left; color: var(--ink-2); }
    .mrow.is-stale { background: var(--stale-hatch); }
    .mv .flag {
      font-size: 9px; letter-spacing: 0.06em; color: var(--ground);
      background: var(--caution); border-radius: var(--radius-sm);
      padding: 1px 4px; vertical-align: 1px;
    }
    .mv.na { color: var(--unavailable-fg); }
    .mv .why {
      display: block; font-size: var(--fs-micro); color: var(--ink-dim);
      max-width: 170px; line-height: 1.3; white-space: normal;
    }

    /* Range and timeframe chips. Small, square-ish and monospaced: a terminal
       control, not a consumer segmented picker. */
    .controls { display: flex; gap: var(--space-1); align-items: center; }
    .chip {
      font: inherit; font-family: var(--font-ui); font-size: var(--fs-caption);
      color: var(--ink-3); background: var(--surface-2);
      border: 1px solid var(--line-2); border-radius: var(--radius-sm);
      padding: var(--space-1) var(--space-3); cursor: pointer;
      transition: color var(--dur-fast) var(--ease-out),
                  background var(--dur-fast) var(--ease-out),
                  border-color var(--dur-fast) var(--ease-out);
    }
    .chip:hover { color: var(--ink-1); border-color: var(--line-3); }
    .chip.is-active {
      color: var(--accent); border-color: var(--accent);
      background: var(--accent-soft);
    }
    .chip:focus-visible {
      outline: var(--focus-ring-w) solid var(--focus-ring); outline-offset: 1px;
    }
    .csep { width: var(--space-3); }

    /* ---- drawing tools ---- */
    .tools {
      width: 40px; flex: none; background: var(--surface-1);
      border-right: 1px solid var(--line-2); overflow-y: auto;
      display: flex; flex-direction: column; align-items: center;
      gap: 2px; padding: var(--space-2) 0;
    }
    .tool-btn {
      width: 30px; height: 30px; display: grid; place-items: center;
      background: none; border: 0; border-radius: var(--radius-sm);
      color: var(--ink-3); cursor: pointer; padding: 0;
      transition: color var(--dur-fast) var(--ease-out),
                  background var(--dur-fast) var(--ease-out);
    }
    .tool-btn svg { width: 17px; height: 17px; display: block; }
    .tool-btn:hover { color: var(--ink-1); background: var(--surface-hover); }
    .tool-btn.is-active { color: var(--accent); background: var(--accent-soft); }
    .tool-btn.is-danger:hover { color: var(--neg); }
    .tool-btn:focus-visible {
      outline: var(--focus-ring-w) solid var(--focus-ring); outline-offset: -1px;
    }
    .tool-fallback {
      font-family: var(--font-ui); font-size: 10px; letter-spacing: .02em;
    }
    .tool-gap {
      width: 18px; height: 1px; background: var(--line-2);
      margin: var(--space-1) 0;
    }

    /* ---- left rail: what the chart draws ---- */
    .rail {
      width: var(--rail-w); flex: none; background: var(--surface-1);
      border-right: 1px solid var(--line-2); overflow-y: auto;
      display: flex; flex-direction: column; gap: var(--space-4);
      padding: var(--space-3) 0;
    }
    .rail-group { display: flex; flex-direction: column; gap: 1px; }
    .rail-title {
      font-family: var(--font-ui); font-size: 10px; letter-spacing: .12em;
      text-transform: uppercase; color: var(--ink-dim);
      padding: 0 var(--space-2) var(--space-1); text-align: center;
    }
    .rail-btn {
      font: inherit; font-family: var(--font-ui); font-size: var(--fs-micro);
      color: var(--ink-3); background: none; border: 0;
      border-left: 2px solid transparent;
      padding: var(--space-2) var(--space-1); cursor: pointer; text-align: center;
      transition: color var(--dur-fast) var(--ease-out),
                  background var(--dur-fast) var(--ease-out);
    }
    .rail-btn:hover { color: var(--ink-1); background: var(--surface-hover); }
    .rail-btn.is-active {
      color: var(--accent); background: var(--accent-soft);
      border-left-color: var(--accent);
    }
    .rail-btn:focus-visible {
      outline: var(--focus-ring-w) solid var(--focus-ring); outline-offset: -2px;
    }

    .rightbar { display: flex; align-items: center; gap: var(--space-3); }

    /* ---- collapsible metric groups ---- */
    .mgroup { border-bottom: 1px solid var(--line-2); }
    .mhead {
      display: grid; grid-template-columns: 12px 1fr auto;
      gap: var(--space-2); align-items: center; width: 100%;
      font: inherit; font-family: var(--font-ui); font-size: var(--fs-micro);
      letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
      background: none; border: 0; cursor: pointer;
      padding: var(--space-3) var(--space-3);
      transition: color var(--dur-fast) var(--ease-out);
    }
    .mhead:hover { color: var(--ink-1); background: var(--surface-hover); }
    .mhead:focus-visible {
      outline: var(--focus-ring-w) solid var(--focus-ring); outline-offset: -2px;
    }
    .caret {
      width: 0; height: 0; justify-self: center;
      border-left: 4px solid transparent; border-right: 4px solid transparent;
      border-top: 5px solid var(--ink-dim);
      transform: rotate(-90deg);
      transition: transform var(--dur-fast) var(--ease-out);
    }
    .caret.is-open { transform: rotate(0deg); }
    .mcount {
      color: var(--ink-dim); letter-spacing: 0;
      font-variant-numeric: tabular-nums;
    }
    .mbody { padding-bottom: var(--space-2); }

    /* ---- paper desk panel ---- */
    .deskpanel { width: 324px; }
    .acctlist { display: flex; flex-direction: column; }
    .acct {
      display: grid; grid-template-columns: 1fr auto auto auto;
      gap: var(--space-2); align-items: baseline;
      font: inherit; font-family: var(--font-mono); font-size: var(--fs-body);
      text-align: left; background: none; border: 0;
      border-left: 2px solid transparent;
      padding: var(--space-2) var(--space-3); cursor: pointer; color: var(--ink-2);
      transition: background var(--dur-fast) var(--ease-out);
    }
    .acct:hover { background: var(--surface-hover); }
    .acct.is-active { background: var(--surface-2); border-left-color: var(--accent); }
    .acct:focus-visible {
      outline: var(--focus-ring-w) solid var(--focus-ring); outline-offset: -2px;
    }
    .acct-name { color: var(--ink-1); }
    .acct-eq, .acct-ret { font-variant-numeric: tabular-nums; }
    .acct-open {
      font-size: 9px; letter-spacing: .06em; color: var(--ground);
      background: var(--info); border-radius: var(--radius-sm); padding: 1px 4px;
    }

    .summary {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 1px; background: var(--line-1);
      margin: 0 var(--space-3) var(--space-2);
    }
    .stat {
      display: flex; flex-direction: column; gap: 2px;
      background: var(--surface-1); padding: var(--space-2) var(--space-3);
    }
    .s-label {
      font-family: var(--font-ui); font-size: var(--fs-micro);
      letter-spacing: .08em;
      text-transform: uppercase; color: var(--ink-dim);
    }
    .s-value {
      font-family: var(--font-mono); font-size: var(--fs-body-lg);
      font-variant-numeric: tabular-nums; color: var(--ink-1);
    }

    .trow, .rrow {
      font-family: var(--font-mono); font-size: var(--fs-caption);
      line-height: var(--lh-ui);
      padding: var(--space-2) var(--space-3);
      border-left: 2px solid transparent;
      border-bottom: 1px solid var(--line-1);
    }
    .trow {
      display: flex; flex-direction: column; gap: 1px;
      padding: var(--space-2) var(--space-3);
    }
    .trow-top {
      display: grid; grid-template-columns: auto 1fr auto;
      gap: var(--space-2); align-items: baseline;
    }
    .trow-bottom {
      display: flex; justify-content: space-between; align-items: baseline;
      color: var(--ink-dim); font-size: var(--fs-micro);
    }
    .trow:hover, .rrow:hover { background: var(--surface-hover); }
    .trow.pos { border-left-color: var(--pos); }
    .trow.neg { border-left-color: var(--neg); }
    .t-when, .r-when {
      font-family: var(--font-mono); color: var(--ink-dim);
      font-variant-numeric: tabular-nums;
    }
    .t-out { font-family: var(--font-ui); color: var(--ink-3); }
    .t-side {
      font-family: var(--font-ui); font-size: var(--fs-micro);
      letter-spacing: .06em;
    }
    .t-side.long { color: var(--pos); }
    .t-side.short { color: var(--neg); }
    /* R leads: it is the unit the position was sized in, so it compares across
       trades and accounts in a way the currency figure cannot. */
    .t-r {
      text-align: right; font-size: var(--fs-body);
      font-variant-numeric: tabular-nums;
    }
    .t-net { text-align: right; font-variant-numeric: tabular-nums; }

    .rrow { display: grid; grid-template-columns: 1fr; gap: 1px; }
    .r-why {
      font-family: var(--font-ui);
      color: var(--caution); line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Data semantics, reserved for values. Never used on a control. */
    .pos { color: var(--pos); }
    .neg { color: var(--neg); }
    .flat { color: var(--ink-3); }

    .empty {
      font-family: var(--font-ui); font-size: var(--fs-caption);
      color: var(--ink-dim); line-height: var(--lh-prose);
      padding: var(--space-2) var(--space-4) var(--space-4);
    }
    /* Only a shell command keeps its own line breaks; prose is left to the
       column, which at 300px turns hard newlines into a ragged block. */
    .empty.cmd { white-space: pre-wrap; }
    .boot-error {
      padding: var(--space-3); font-family: var(--font-mono);
      font-size: var(--fs-micro); color: var(--neg); white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <span id="header">loading…</span>
      <span class="rightbar">
        <span id="controls" class="controls"></span>
        <span class="csep"></span>
        <span id="theme" class="controls"></span>
      </span>
    </div>
    <div class="body">
      <nav class="tools" id="tools" aria-label="Drawing tools"></nav>
      <nav class="rail" id="rail" aria-label="Chart layers"></nav>
      <div class="chartcell" id="chart"></div>
      <aside class="panel">
        <div class="ptitle">Metrics</div>
        <div id="panel"></div>
      </aside>
      <aside class="panel deskpanel" id="desk"></aside>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
