<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Desk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230A0E16'/%3E%3Cpath d='M2 11l3-3 3 2 6-6' stroke='%23D98A3D' stroke-width='2' fill='none'/%3E%3C/svg%3E" />
  <style>
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--ground); color: var(--ink-1);
      font-family: var(--font-ui); font-size: var(--fs-body);
      -webkit-font-smoothing: antialiased;
    }
    .shell { display: flex; flex-direction: column; height: 100vh; }
    .topbar {
      height: var(--topbar-h); flex: none; display: flex; align-items: center;
      gap: var(--space-3); padding: 0 var(--space-3);
      justify-content: space-between;
      background: var(--surface-2); border-bottom: 1px solid var(--line-2);
      font-family: var(--font-mono); font-size: var(--fs-caption);
      font-variant-numeric: tabular-nums;
    }
    .body { display: flex; flex: 1; min-height: 0; }
    .chartcell { flex: 1; min-width: 0; position: relative; background: var(--ground); }
    .panel {
      width: 260px; flex: none; background: var(--surface-1);
      border-left: 1px solid var(--line-2); overflow-y: auto;
    }
    .ptitle {
      font-family: var(--font-mono); font-size: var(--fs-micro);
      letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim);
      padding: var(--space-3) var(--space-3) var(--space-2);
    }
    .mrow {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: var(--space-2); padding: 5px var(--space-3);
      border-bottom: 1px solid var(--line-1);
      font-family: var(--font-mono); font-size: var(--fs-caption);
    }
    .mk { color: var(--ink-3); }
    .mv { color: var(--ink-1); font-variant-numeric: tabular-nums; text-align: right; }
    .mrow.is-stale { background: var(--stale-hatch); }
    .mv .flag {
      font-size: 9px; letter-spacing: 0.06em; color: var(--ground);
      background: var(--caution); border-radius: var(--radius-sm);
      padding: 1px 4px; vertical-align: 1px;
    }
    .mv.na { color: var(--unavailable-fg); }
    .mv .why {
      display: block; font-size: var(--fs-micro); color: var(--ink-dim);
      max-width: 170px; line-height: 1.3; white-space: normal;
    }

    /* Range and timeframe chips. Small, square-ish and monospaced: a terminal
       control, not a consumer segmented picker. */
    .controls { display: flex; gap: var(--space-1); align-items: center; }
    .chip {
      font: inherit; font-family: var(--font-mono); font-size: var(--fs-micro);
      color: var(--ink-3); background: var(--surface-2);
      border: 1px solid var(--line-2); border-radius: var(--radius-sm);
      padding: 2px var(--space-2); cursor: pointer;
      transition: color var(--dur-fast) var(--ease-out),
                  background var(--dur-fast) var(--ease-out),
                  border-color var(--dur-fast) var(--ease-out);
    }
    .chip:hover { color: var(--ink-1); border-color: var(--line-3); }
    .chip.is-active {
      color: var(--accent); border-color: var(--accent);
      background: var(--accent-soft);
    }
    .chip:focus-visible {
      outline: var(--focus-ring-w) solid var(--focus-ring); outline-offset: 1px;
    }
    .csep { width: var(--space-3); }
    .boot-error {
      padding: var(--space-3); font-family: var(--font-mono);
      font-size: var(--fs-micro); color: var(--neg); white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <span id="header">loading…</span>
      <span id="controls" class="controls"></span>
    </div>
    <div class="body">
      <div class="chartcell" id="chart"></div>
      <aside class="panel">
        <div class="ptitle">Metrics</div>
        <div id="panel"></div>
      </aside>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
