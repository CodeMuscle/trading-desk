[project]
name = "desk"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "CodeMuscle", email = "ganeshgovind11@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ccxt>=4.5.94",
    "fastapi[standard]>=0.165.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
